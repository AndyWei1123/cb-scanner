name: 每日可轉債掃描

on:
  schedule:
    # UTC 22:00 = 台灣時間 06:00，週一至週五執行
    - cron: '0 22 * * 1-5'
  workflow_dispatch:   # 允許手動觸發

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允許寫入 repo（commit 結果檔）

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CB Scanner
        run: python cb_scanner.py

      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --ignore-missing cb_dashboard.html cb_data.json trade_log.json cb_history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto update CB dashboard $(date +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD
          else
            echo "No changes to commit, skipping push."
          fi
